[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatpulse-local"
version = "0.1.0"
description = "Privacy-first Telegram digest tooling with local-only LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ChatPulse contributors"}]
dependencies = [
    "telethon>=1.45,<2",
    "keyring>=25.6,<26",
    "prompt_toolkit>=3.0.53,<4",
    "qrcode>=8,<9",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.scripts]
chatpulse = "chatpulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13"]
vision = ["Pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
